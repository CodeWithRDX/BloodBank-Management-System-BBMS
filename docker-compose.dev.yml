# ══════════════════════════════════════════════════════════════════════════════
# BBMS — Development Override
# Adds: hot-reload for server/client, mongo-express DB admin UI
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Or set COMPOSE_FILE in your shell:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#   docker compose up
# ══════════════════════════════════════════════════════════════════════════════

name: bbms

services:

  # ── MongoDB — override: expose port for local clients (e.g. Compass) ─────────
  mongo:
    ports:
      - "${MONGO_PORT:-27017}:27017"

  # ── Server — override: nodemon hot-reload + bind mount source ────────────────
  server:
    build:
      target: deps           # Use deps stage — devDeps included
    environment:
      NODE_ENV: development
    # Override CMD to use nodemon for hot-reload
    command: ["node", "--watch", "server.js"]
    volumes:
      # Bind mount source for live code changes (overrides production)
      - ./server:/app
      # Keep node_modules from the image (don't overwrite with host)
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      # Expose server directly for dev tools / Postman / etc.
      - "${SERVER_PORT:-5000}:5000"

  # ── Client — override: Vite dev server with HMR ──────────────────────────────
  client:
    build:
      # Use a dedicated dev Dockerfile target
      target: builder
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    # In dev, client doesn't need to wait for server to be healthy
    depends_on:
      - server

  # ── Nginx — override: disabled in dev (access via direct ports above) ─────────
  nginx:
    profiles:
      - proxy   # Only starts when --profile proxy is passed

  # ── Mongo Express — MongoDB admin UI (dev only) ───────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: bbms-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-bbms_secret_2024}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-bbms_secret_2024}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:-bbms_express_2024}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - bbms-backend
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - tools  # Only starts when: docker compose --profile tools up
