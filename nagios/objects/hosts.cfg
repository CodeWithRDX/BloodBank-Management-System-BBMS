# ──────────────────────────────────────────────────────────────────────────────
# Nagios Host Definition for BBMS Application Server
# ──────────────────────────────────────────────────────────────────────────────

define host {
    use                     linux-server
    host_name               bbms-server
    alias                   BBMS Production EC2 Server
    address                 127.0.0.1
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          bbms-admins
}

define hostgroup {
    hostgroup_name          bbms-servers
    alias                   BBMS Core Production Servers
    members                 bbms-server
}

