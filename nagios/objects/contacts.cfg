# ──────────────────────────────────────────────────────────────────────────────
# Nagios Contact & Contact Group Definitions for BBMS
# ──────────────────────────────────────────────────────────────────────────────

define contact {
    contact_name                    nagiosadmin
    alias                           BBMS DevOps Administrator
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r,f,s
    host_notification_options       d,u,r,f,s
    service_notification_commands   notify-service-by-email-bbms
    host_notification_commands      notify-host-by-email-bbms
    email                           admin@bbms.local
}

define contactgroup {
    contactgroup_name               bbms-admins
    alias                           BBMS Engineering & Operations Team
    members                         nagiosadmin
}

