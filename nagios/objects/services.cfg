# ──────────────────────────────────────────────────────────────────────────────
# Nagios Service Definitions for BBMS Infrastructure & Application
# ──────────────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════════════════════
# 1. INFRASTRUCTURE & SERVER METRICS
# ══════════════════════════════════════════════════════════════════════════════

# Host Ping / Network Latency
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     Network Connectivity (PING)
    check_command           check_ping!100.0,20%!500.0,60%
    check_interval          1
    retry_interval          1
    contact_groups          bbms-admins
}

# Root Disk Space
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     Root Disk Space (EBS)
    check_command           check_local_disk!20%!10%!/
    check_interval          5
    retry_interval          2
    contact_groups          bbms-admins
}

# CPU System Load
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     System CPU Load
    check_command           check_local_load!5.0,4.0,3.0!10.0,8.0,6.0
    check_interval          1
    retry_interval          1
    contact_groups          bbms-admins
}

# RAM / Memory Utilization
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     Memory Utilization
    check_command           check_mem!80!90
    check_interval          2
    retry_interval          1
    contact_groups          bbms-admins
}

# SSH Daemon Status
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     SSH Remote Access
    check_command           check_ssh
    check_interval          5
    retry_interval          2
    contact_groups          bbms-admins
}

# ══════════════════════════════════════════════════════════════════════════════
# 2. APPLICATION SERVICES & RUNTIME MONITORING
# ══════════════════════════════════════════════════════════════════════════════

# Nginx Web Server Availability (Port 80)
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     Nginx Web Server
    check_command           check_http_port!80
    check_interval          1
    retry_interval          1
    contact_groups          bbms-admins
}

# Nginx Dedicated Health Check Endpoint (/nginx-health)
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     Nginx Health Endpoint
    check_command           check_http_content!80!/nginx-health!healthy
    check_interval          1
    retry_interval          1
    contact_groups          bbms-admins
}

# Frontend React SPA Availability (HTTP GET / returning 200 OK)
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     React Frontend SPA
    check_command           check_http_status!80!/!200
    check_interval          2
    retry_interval          1
    contact_groups          bbms-admins
}

# Backend Node.js / Express API Health Endpoint (/api/health)
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     Backend API Health Endpoint (/api/health)
    check_command           check_http_content!80!/api/health!"success":true
    check_interval          1
    retry_interval          1
    contact_groups          bbms-admins
}

# PM2 Backend Process Lifecycle
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     PM2 Node.js Process (bbms-backend)
    check_command           check_pm2_process!bbms-backend
    check_interval          1
    retry_interval          1
    contact_groups          bbms-admins
}

# MongoDB Database Service Availability (Port 27017 Local Check)
define service {
    use                     generic-service
    host_name               bbms-server
    service_description     MongoDB Database Service
    check_command           check_mongodb_service
    check_interval          2
    retry_interval          1
    contact_groups          bbms-admins
}

