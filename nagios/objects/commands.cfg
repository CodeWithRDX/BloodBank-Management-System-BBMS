# ──────────────────────────────────────────────────────────────────────────────
# Nagios Command Definitions for BBMS
# ──────────────────────────────────────────────────────────────────────────────

# Check HTTP on custom port
define command {
    command_name    check_http_port
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$
}

# Check HTTP URL response code
define command {
    command_name    check_http_status
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e $ARG3$
}

# Check HTTP URL content / string match
define command {
    command_name    check_http_content
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -s $ARG3$
}

# Check Local Memory Utilization (Custom Plugin)
# ARG1: Warning percentage (e.g. 80)
# ARG2: Critical percentage (e.g. 90)
define command {
    command_name    check_mem
    command_line    $USER1$/check_mem.sh -w $ARG1$ -c $ARG2$
}

# Check PM2 Process status (Custom Plugin)
# ARG1: Process name (e.g. bbms-backend)
define command {
    command_name    check_pm2_process
    command_line    $USER1$/check_pm2.sh $ARG1$
}

# Check MongoDB service status (Custom Plugin)
define command {
    command_name    check_mongodb_service
    command_line    $USER1$/check_mongo.sh
}

# Notification Commands
define command {
    command_name    notify-host-by-email-bbms
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\nHost: $HOSTNAME$\nState: $HOSTSTATE$\nAddress: $HOSTADDRESS$\nInfo: $HOSTOUTPUT$\n\nDate/Time: $LONGDATETIME$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Host Alert: $HOSTNAME$ is $HOSTSTATE$ **" $CONTACTEMAIL$
}

define command {
    command_name    notify-service-by-email-bbms
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\nService: $SERVICEDESC$\nHost: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $SERVICESTATE$\n\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n\n$SERVICEOUTPUT$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Service Alert: $HOSTALIAS$/$SERVICEDESC$ is $SERVICESTATE$ **" $CONTACTEMAIL$
}

