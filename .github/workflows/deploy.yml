name: BBMS Continuous Integration & Continuous Deployment (CI/CD)

# ──────────────────────────────────────────────────────────────────────────────
# Trigger on code push to main or manual workflow dispatch
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'ansible/**'
      - '.vscode/**'
      - '.gitignore'
      - '.vercelignore'
      - 'vercel.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'ansible/**'
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Deploy to EC2 after successful build & test'
        required: false
        type: boolean
        default: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Continuous Integration (CI) - Lint, Dependency & Compile Check
  # ────────────────────────────────────────────────────────────────────────────
  ci-build-and-test:
    name: Build & Compile Verification (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & Verify Backend Dependencies
        run: |
          cd server
          npm ci --prefer-offline --no-audit

      - name: Install Frontend Dependencies & Verify Vite Compilation
        run: |
          cd client
          npm ci --prefer-offline --no-audit
          npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Continuous Deployment (CD) - Containerized Deployment on EC2
  # ────────────────────────────────────────────────────────────────────────────
  cd-deploy-to-ec2:
    name: Continuous Deployment to Production EC2 (Docker Compose)
    runs-on: ubuntu-latest
    needs: ci-build-and-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_to_ec2 == true || inputs.deploy_to_ec2 == 'true' || inputs.deploy_to_ec2 == null))

    steps:
      - name: Deploy Container Stack to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CD Pipeline] Deploying latest BBMS containers to EC2..."
            
            APP_DIR="${{ secrets.EC2_DEPLOY_PATH || '/var/www/bbms' }}"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Target directory $APP_DIR does not exist. Bootstrapping repository..."
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/CodeWithRDX/BloodBank-Management-System-BBMS-.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            echo "📥 Pulling latest commits from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            
            # Ensure .env exists from template if missing
            if [ ! -f .env ]; then
              echo "Creating .env from .env.docker template..."
              cp .env.docker .env
            fi
            
            echo "🐳 Rebuilding and rolling out updated containers..."
            docker compose up -d --build
            
            echo "🧹 Pruning old unused Docker images..."
            docker image prune -f
            
            echo "🩺 Verifying container status..."
            sleep 10
            docker compose ps
            
            echo "Checking Nginx Health..."
            curl -sf http://127.0.0.1/nginx-health || true
            
            echo "Checking API Health..."
            curl -sf http://127.0.0.1/api/health || true
            
            echo "✅ [CD Pipeline] BBMS Docker containers successfully deployed!"
