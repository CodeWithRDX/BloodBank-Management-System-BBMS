name: BBMS Continuous Integration & Continuous Deployment (CI/CD)

# ──────────────────────────────────────────────────────────────────────────────
# Trigger on code push to main or manual workflow dispatch
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'ansible/**'
      - 'nagios/**'
      - '.vscode/**'
      - '.gitignore'
      - '.vercelignore'
      - 'vercel.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
      - 'ansible/**'
      - 'nagios/**'
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Deploy to EC2 after successful build & test'
        required: false
        type: boolean
        default: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Continuous Integration (CI) - Lint, Dependency & Compile Check
  # ────────────────────────────────────────────────────────────────────────────
  ci-build-and-test:
    name: Build & Compile Verification (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & Verify Backend Dependencies
        run: |
          cd server
          npm ci --prefer-offline --no-audit

      - name: Install Frontend Dependencies & Verify Vite Compilation
        run: |
          cd client
          npm ci --prefer-offline --no-audit
          npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Continuous Deployment (CD) - Zero-Downtime Rollout to EC2
  # ────────────────────────────────────────────────────────────────────────────
  cd-deploy-to-ec2:
    name: Continuous Deployment to Production EC2 (CD)
    runs-on: ubuntu-latest
    needs: ci-build-and-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_to_ec2 == true || inputs.deploy_to_ec2 == 'true' || inputs.deploy_to_ec2 == null))

    steps:
      - name: Execute Deployment on EC2 Host via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CD Pipeline] Deploying latest BBMS changes to EC2..."
            
            APP_DIR="${{ secrets.EC2_DEPLOY_PATH || '/var/www/bbms' }}"
            
            # Ensure target directory exists and is owned by the current user
            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Target directory $APP_DIR does not exist. Bootstrapping repository..."
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/CodeWithRDX/BloodBank-Management-System-BBMS-.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            echo "📥 Pulling latest commits from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            
            # Verify Node.js and PM2 are installed (from Server Setup workflow)
            if ! command -v node >/dev/null 2>&1 || ! command -v pm2 >/dev/null 2>&1; then
              echo "⚠️ Node.js or PM2 is not installed on this EC2 instance yet!"
              echo "👉 Please run the 'Server Setup & Configuration (Ansible via GitHub Actions)' workflow first to install Node.js, MongoDB, Nginx, and PM2."
              exit 1
            fi
            
            echo "📦 Updating backend dependencies..."
            cd "$APP_DIR/server"
            npm ci --prefer-offline --no-audit
            
            echo "🔄 Performing zero-downtime PM2 backend reload..."
            if pm2 describe bbms-backend >/dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save
            
            echo "🎨 Building optimized React SPA frontend bundle..."
            cd "$APP_DIR/client"
            npm ci --prefer-offline --no-audit
            npm run build
            
            echo "🩺 Verifying backend health check endpoint..."
            sleep 3
            curl -sf http://127.0.0.1:5000/api/health || curl -sf http://127.0.0.1/api/health
            
            echo "✅ [CD Pipeline] BBMS deployment successfully rolled out with zero downtime!"
