name: Server Setup & Configuration (Ansible via GitHub Actions)

# ──────────────────────────────────────────────────────────────────────────────
# Trigger manually from the GitHub Actions tab (Run workflow)
# Sets up Docker, Docker Compose, and base firewall on the EC2 instance using Ansible
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

jobs:
  ansible-docker-setup:
    name: Install Docker & Configure Host via Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible on GitHub Cloud Runner
        run: |
          pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.general

      - name: Configure SSH Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for EC2 SSH Reachability
        run: |
          echo "Connecting to ${{ secrets.EC2_HOST }} on port 22..."
          for i in {1..30}; do
            if nc -z -w 3 "${{ secrets.EC2_HOST }}" 22 2>/dev/null; then
              echo "✅ SSH is reachable on ${{ secrets.EC2_HOST }}!"
              break
            fi
            echo "Waiting for SSH to become ready ($i/30)..."
            sleep 5
          done

      - name: Generate Dynamic Ansible Inventory
        run: |
          mkdir -p ansible/inventory
          cat <<EOF > ansible/inventory/hosts.ini
          [bbms_servers]
          bbms-node-01 ansible_host=${{ secrets.EC2_HOST }} ansible_user=${{ secrets.EC2_USERNAME || 'ubuntu' }} ansible_ssh_private_key_file=~/.ssh/id_rsa

          [all:children]
          bbms_servers
          EOF

      - name: Run Ansible Docker & Base Setup (site.yml)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.ini playbooks/site.yml

      - name: Bootstrap Initial BBMS Docker Compose Stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Bootstrapping BBMS repository and containers on EC2..."
            APP_DIR="${{ secrets.EC2_DEPLOY_PATH || '/var/www/bbms' }}"
            
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/CodeWithRDX/BloodBank-Management-System-BBMS-.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            
            if [ ! -f .env ]; then
              echo "Generating production .env file from .env.docker template..."
              cp .env.docker .env
              # Generate random secure passwords if default placeholders are present
              JWT_RANDOM=$(openssl rand -base64 32 | tr -d '=/+')
              sed -i "s/change_me_to_a_very_long_random_string_in_production/$JWT_RANDOM/g" .env || true
            fi
            
            echo "🐳 Starting BBMS container stack (nginx, client, server, mongo, nagios)..."
            docker compose up -d --build
            
            echo "=========================================================="
            echo "🎉 Server Configuration & Docker Stack Initialized Successfully!"
            echo "=========================================================="
