---
- name: Install Nginx web server
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default Nginx site configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy BBMS Nginx reverse proxy configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/bbms.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Enable BBMS Nginx site configuration
  ansible.builtin.file:
    src: /etc/nginx/sites-available/bbms.conf
    dest: /etc/nginx/sites-enabled/bbms.conf
    state: link
  notify: Reload nginx

- name: Test Nginx configuration syntax
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure Nginx service is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: started

