---
- name: Download NodeSource GPG signing key
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'

- name: Add NodeSource Node.js {{ nodejs_version }}.x repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js runtime and npm
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Verify installed Node.js version
  ansible.builtin.command: node -v
  register: node_version_out
  changed_when: false

- name: Verify installed npm version
  ansible.builtin.command: npm -v
  register: npm_version_out
  changed_when: false

- name: Display Node.js and npm versions
  ansible.builtin.debug:
    msg: "Node version: {{ node_version_out.stdout }} | npm version: {{ npm_version_out.stdout }}"

- name: Install PM2 process manager globally
  ansible.builtin.npm:
    name: pm2
    global: yes
    state: present

- name: Install PM2 logrotate module
  ansible.builtin.command: pm2 install pm2-logrotate
  register: pm2_logrotate_install
  changed_when: "'Module pm2-logrotate installed' in pm2_logrotate_install.stdout"
  failed_when: false

