---
# ──────────────────────────────────────────────────────────────────────────────
# Ansible Role: Docker & Docker Compose Plugin Setup for Ubuntu
# ──────────────────────────────────────────────────────────────────────────────

- name: Install prerequisite packages for Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Create directory for apt keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download official Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add official Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker Engine, CLI, and Docker Compose Plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure docker service is running and enabled on boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Add application user to docker group
  ansible.builtin.user:
    name: "{{ app_user | default('ubuntu') }}"
    groups: docker
    append: yes

- name: Verify Docker version
  ansible.builtin.command: docker --version
  register: docker_version_out
  changed_when: false

- name: Verify Docker Compose plugin version
  ansible.builtin.command: docker compose version
  register: compose_version_out
  changed_when: false

- name: Output installed Docker information
  ansible.builtin.debug:
    msg: "Installed {{ docker_version_out.stdout }} and {{ compose_version_out.stdout }}"

