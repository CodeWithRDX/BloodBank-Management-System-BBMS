---
- name: Ensure target application directory exists
  ansible.builtin.file:
    path: "{{ app_root_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Clone or update BBMS Git repository
  ansible.builtin.git:
    repo: "{{ git_repo_url }}"
    dest: "{{ app_root_dir }}"
    version: "{{ git_branch | default('main') }}"
    force: yes
  become_user: "{{ app_user }}"
  register: git_clone_result

- name: Ensure uploads and logs directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0775'
  loop:
    - "{{ app_uploads_dir }}"
    - "/var/log/bbms"

- name: Deploy production backend .env configuration file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ app_server_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  notify: Restart bbms

- name: Deploy PM2 ecosystem configuration file
  ansible.builtin.template:
    src: ecosystem.config.cjs.j2
    dest: "{{ app_server_dir }}/ecosystem.config.cjs"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Install backend npm dependencies
  ansible.builtin.command: npm ci --prefer-offline --no-audit
  args:
    chdir: "{{ app_server_dir }}"
  become_user: "{{ app_user }}"
  register: npm_server_install
  changed_when: "'added' in npm_server_install.stdout or 'updated' in npm_server_install.stdout"

- name: Install frontend npm dependencies
  ansible.builtin.command: npm ci --prefer-offline --no-audit
  args:
    chdir: "{{ app_client_dir }}"
  become_user: "{{ app_user }}"
  register: npm_client_install
  changed_when: "'added' in npm_client_install.stdout or 'updated' in npm_client_install.stdout"

- name: Build React SPA frontend with Vite
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ app_client_dir }}"
  become_user: "{{ app_user }}"
  register: vite_build
  changed_when: true

- name: Check if BBMS backend process is active in PM2
  ansible.builtin.command: pm2 describe {{ pm2_app_name }}
  register: pm2_status
  failed_when: false
  changed_when: false
  become_user: "{{ app_user }}"

- name: Start BBMS backend application via PM2
  ansible.builtin.command: pm2 start ecosystem.config.cjs
  args:
    chdir: "{{ app_server_dir }}"
  become_user: "{{ app_user }}"
  when: pm2_status.rc != 0

- name: Reload BBMS backend application in PM2 (Zero Downtime)
  ansible.builtin.command: pm2 reload ecosystem.config.cjs --update-env
  args:
    chdir: "{{ app_server_dir }}"
  become_user: "{{ app_user }}"
  when: pm2_status.rc == 0

- name: Save PM2 process list
  ansible.builtin.command: pm2 save
  become_user: "{{ app_user }}"
  changed_when: false

- name: Configure PM2 startup hook on boot
  ansible.builtin.command: env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  register: pm2_startup
  changed_when: "'already configured' not in pm2_startup.stdout"
  failed_when: false

