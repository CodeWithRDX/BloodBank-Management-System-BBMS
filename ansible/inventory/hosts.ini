# ──────────────────────────────────────────────────────────────────────────────
# Ansible Inventory for BBMS
# Replace <EC2_PUBLIC_IP> with the output from `terraform output -raw ec2_public_ip`
# and specify the path to your SSH private key.
# ──────────────────────────────────────────────────────────────────────────────

[bbms_servers]
bbms-node-01 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/bbms-keypair.pem

[monitoring_servers]
bbms-node-01 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/bbms-keypair.pem

[all:children]
bbms_servers
monitoring_servers

