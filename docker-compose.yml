# ══════════════════════════════════════════════════════════════════════════════
# BBMS — Production Docker Compose
# Stack:
#   - nginx        → Reverse Proxy
#   - client       → React/Vite Frontend
#   - server       → Node.js / Express API + Socket.IO
#   - mongo        → MongoDB Database
#   - mongo-express→ Optional DB Admin Tool
#
# Usage:
#   docker compose up -d
#   docker compose up -d --build
#   docker compose logs -f server
#   docker compose exec server sh
#   docker compose down
#   docker compose down -v
#
# Optional Tools:
#   docker compose --profile tools up -d
# ══════════════════════════════════════════════════════════════════════════════

name: bbms

services:

  # ────────────────────────────────────────────────────────────────────────────
  # MongoDB
  # Internal database service
  # ────────────────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:8.2.9
    container_name: bbms-mongo
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo/init:/docker-entrypoint-initdb.d:ro

    networks:
      - bbms-backend

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Backend API
  # Node.js + Express + Socket.IO
  # ────────────────────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production

    container_name: bbms-server
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5000

      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE}
      JWT_COOKIE_EXPIRE: ${JWT_COOKIE_EXPIRE}

      CLIENT_URL: ${CLIENT_URL}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      FROM_EMAIL: ${FROM_EMAIL}
      FROM_NAME: ${FROM_NAME}

      MAX_FILE_SIZE: ${MAX_FILE_SIZE}

      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}

    volumes:
      - uploads_data:/app/uploads

    networks:
      - bbms-backend
      - bbms-frontend

    expose:
      - "5000"

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend
  # React/Vite static build served by nginx
  # ────────────────────────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

    container_name: bbms-client
    restart: unless-stopped

    networks:
      - bbms-frontend

    expose:
      - "80"

    depends_on:
      server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # Public entry point
  #
  # Routes:
  #   /           → client
  #   /api        → server
  #   /socket.io  → server (WebSocket)
  # ────────────────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: bbms-nginx
    restart: unless-stopped

    ports:
      - "${HTTP_PORT}:80"

    networks:
      - bbms-frontend

    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Mongo Express (Optional)
  # Database administration tool
  #
  # Start manually:
  #   docker compose --profile tools up -d
  #
  # Recommended:
  #   Access through SSH tunnel only
  # ────────────────────────────────────────────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: bbms-mongo-express
    restart: "no"

    profiles:
      - tools

    env_file:
      - .env

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}

      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/

      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS}

      ME_CONFIG_SITE_BASEURL: /

    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT}:8081"

    networks:
      - bbms-backend

    depends_on:
      mongo:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# ══════════════════════════════════════════════════════════════════════════════
# Networks
# ══════════════════════════════════════════════════════════════════════════════
networks:

  # Internal backend communication
  bbms-backend:
    name: bbms-backend
    driver: bridge

  # Frontend communication layer
  bbms-frontend:
    name: bbms-frontend
    driver: bridge

# ══════════════════════════════════════════════════════════════════════════════
# Persistent Volumes
# ══════════════════════════════════════════════════════════════════════════════
volumes:

  mongo_data:
    name: bbms_mongo_data
    driver: local

  mongo_config:
    name: bbms_mongo_config
    driver: local

  uploads_data:
    name: bbms_uploads
    driver: local
