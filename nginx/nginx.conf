# ──────────────────────────────────────────────────────────────────────────────
# BBMS Nginx Reverse Proxy
# Routes:
#   /api/*        → server:5000  (REST API)
#   /socket.io/*  → server:5000  (WebSocket — Socket.IO)
#   /*            → client:80    (React SPA served by Nginx)
#
# WHY no upstream {} blocks?
#   upstream {} causes Nginx to resolve hostnames EAGERLY at startup/build time.
#   During `docker build`, the Docker network doesn't exist yet, so "server" and
#   "client" can't be resolved → build fails.
#   Instead, we use variables + resolver so hostnames are resolved LAZILY at
#   request time (when the Docker network IS running).
# ──────────────────────────────────────────────────────────────────────────────

# ── Rate limiting zones ────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name bbms.raushan.live;

    # ── Docker's internal DNS resolver (127.0.0.11) ────────────────────────────
    # valid=30s  → re-resolve every 30 seconds (handles container restarts)
    # ipv6=off   → skip AAAA lookups in Docker bridge networks
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Security headers
    add_header X-Frame-Options    "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                  always;
    add_header X-XSS-Protection   "1; mode=block"                always;
    add_header Referrer-Policy    "strict-origin-when-cross-origin" always;

    # Max upload size
    client_max_body_size 10M;
    client_body_timeout  30s;

    # ── Auth routes — strict rate limiting ──────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        set $backend_server http://server:5000;
        proxy_pass $backend_server;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── REST API routes ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        set $backend_server http://server:5000;
        proxy_pass $backend_server;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── Socket.IO — WebSocket upgrade ───────────────────────────────────────────
    location /socket.io/ {
        set $backend_server http://server:5000;
        proxy_pass $backend_server;

        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-lived WebSocket connections
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ── Uploaded files ──────────────────────────────────────────────────────────
    location /uploads/ {
        set $backend_server http://server:5000;
        proxy_pass $backend_server;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── React SPA (everything else) ─────────────────────────────────────────────
    location / {
        set $frontend_server http://client:80;
        proxy_pass $frontend_server;

        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_intercept_errors off;
    }

    # ── Health check endpoint (no upstream needed) ────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
